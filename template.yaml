AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless application using an existing orders table

Globals:
  Function:
    PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/EventDrivenAppLambdaBoundary

Parameters:
  OrdersTableName:
    Type: String
    Default: Orders
    Description: Name of the existing DynamoDB orders table
  SecondaryEventBusRegion:
    Type: String
    Default: ''
    Description: Optional secondary region for an EventBridge global endpoint configuration.
  SecondaryEventBusName:
    Type: String
    Default: OrdersEventBus
    Description: Optional secondary event bus name for a multi-region EventBridge global endpoint.

Conditions:
  HasGlobalEndpointConfiguration: !And
    - !Not [!Equals [!Ref SecondaryEventBusRegion, '']]
    - !Not [!Equals [!Ref SecondaryEventBusName, '']]

Resources:
  OrdersEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: OrdersEventBus

  OrdersEventBusGlobalEndpoint:
    Condition: HasGlobalEndpointConfiguration
    Type: AWS::Events::Endpoint
    Properties:
      Name: OrdersEventBusGlobalEndpoint
      Description: Global endpoint for the OrdersEventBus
      EventBuses:
        - EventBusArn: !GetAtt OrdersEventBus.Arn
        - EventBusArn: !Sub arn:${AWS::Partition}:events:${SecondaryEventBusRegion}:${AWS::AccountId}:event-bus/${SecondaryEventBusName}
      RoutingConfig:
        FailoverConfig:
          Primary:
            HealthCheck: !Sub arn:${AWS::Partition}:route53:::healthcheck/${AWS::StackName}-orders-primary
          Secondary:
            Route: !Ref SecondaryEventBusRegion

  OrderNotificationsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts the OrderNotificationsTopic SNS messages
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: AllowEventBridgeToEncryptTopicMessages
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: '*'

  OrderNotificationsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/OrderNotificationsTopic
      TargetKeyId: !Ref OrderNotificationsKey

  SNSDeliveryStatusLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:OrderNotificationsTopic
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: WriteSNSDeliveryStatusLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sns/*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sns/*:log-stream:*

  OrderNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: OrderNotificationsTopic
      KmsMasterKeyId: !GetAtt OrderNotificationsKey.Arn
      DeliveryStatusLogging:
        - Protocol: lambda
          FailureFeedbackRoleArn: !GetAtt SNSDeliveryStatusLoggingRole.Arn
          SuccessFeedbackRoleArn: !GetAtt SNSDeliveryStatusLoggingRole.Arn
          SuccessFeedbackSampleRate: '100'
        - Protocol: sqs
          FailureFeedbackRoleArn: !GetAtt SNSDeliveryStatusLoggingRole.Arn
          SuccessFeedbackRoleArn: !GetAtt SNSDeliveryStatusLoggingRole.Arn
          SuccessFeedbackSampleRate: '100'

  OrderNotificationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref OrderNotificationsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowOrderCreatedRule
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OrderNotificationsTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${OrdersEventBus}/OrderCreatedRule
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: AllowOrderProcessedRule
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OrderNotificationsTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${OrdersEventBus}/OrderProcessedRule
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  EventDrivenAppIdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: EventDrivenAppIdempotencyTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: idempotencyKey
          AttributeType: S
      KeySchema:
        - AttributeName: idempotencyKey
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  EventDrivenAppOrderDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: EventDrivenAppOrderDLQ
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:EventDrivenAppOrderQueue

  EventDrivenAppOrderQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: EventDrivenAppOrderQueue
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventDrivenAppOrderDLQ.Arn
        maxReceiveCount: 3

  ApiGatewaySqsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-ApiGatewaySqsRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:*/*/POST/orders
      Policies:
        - PolicyName: SendOrdersToQueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt EventDrivenAppOrderQueue.Arn

  OrderProcessingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: OrderProcessingDLQ

  OrderProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: OrderProcessingQueue
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrderProcessingDLQ.Arn
        maxReceiveCount: 5

  OrderEventDeliveryDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: OrderEventDeliveryDLQ

  OrderCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: OrderCreatedRule
      EventBusName: !Ref OrdersEventBus
      EventPattern:
        source:
          - orders.service
        detail-type:
          - OrderCreated
      Targets:
        - Id: OrderNotificationFunctionTarget
          Arn: !GetAtt OrderNotificationFunction.Arn
        - Id: OrderProcessingQueueTarget
          Arn: !GetAtt OrderProcessingQueue.Arn
          DeadLetterConfig:
            Arn: !GetAtt OrderEventDeliveryDLQ.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 10
        - Id: OrderNotificationsTopicTarget
          Arn: !Ref OrderNotificationsTopic
          DeadLetterConfig:
            Arn: !GetAtt OrderEventDeliveryDLQ.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 10

  OrderProcessedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: OrderProcessedRule
      EventBusName: !Ref OrdersEventBus
      EventPattern:
        source:
          - orders.processing
        detail-type:
          - OrderProcessed
      Targets:
        - Id: OrderNotificationFunctionTarget
          Arn: !GetAtt OrderNotificationFunction.Arn
        - Id: OrderNotificationsTopicTarget
          Arn: !Ref OrderNotificationsTopic
          DeadLetterConfig:
            Arn: !GetAtt OrderEventDeliveryDLQ.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 10

  OrderProcessingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref OrderProcessingQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt OrderProcessingQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${OrdersEventBus}/OrderCreatedRule
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  OrderEventDeliveryDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref OrderEventDeliveryDLQ
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt OrderEventDeliveryDLQ.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${OrdersEventBus}/OrderCreatedRule
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  OrderNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/order-notification/
      Handler: index.handler
      Runtime: nodejs22.x

  ProcessOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/process-order/
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 30
      Tracing: Active
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTableName
          IDEMPOTENCY_TABLE: !Ref EventDrivenAppIdempotencyTable
          ORDERS_EVENT_BUS: !Ref OrdersEventBus
          ORDERS_EVENT_ENDPOINT: !If [HasGlobalEndpointConfiguration, !Ref OrdersEventBusGlobalEndpoint, !Ref AWS::NoValue]
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ChangeMessageVisibility
              Resource:
                - !GetAtt OrderProcessingQueue.Arn
                - !GetAtt EventDrivenAppOrderQueue.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:TransactWriteItems
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OrdersTableName}
                - !GetAtt EventDrivenAppIdempotencyTable.Arn
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource:
                - !GetAtt OrdersEventBus.Arn
                - !If [HasGlobalEndpointConfiguration, !GetAtt OrdersEventBusGlobalEndpoint.Arn, !Ref AWS::NoValue]
      Events:
        ProcessOrderMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderProcessingQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
        ProcessApiOrderMessages:
          Type: SQS
          Properties:
            Queue: !GetAtt EventDrivenAppOrderQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  OrderCreatedRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrderNotificationFunction
      Principal: events.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${OrdersEventBus}/OrderCreatedRule

  OrderProcessedRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrderNotificationFunction
      Principal: events.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${OrdersEventBus}/OrderProcessedRule

  OrdersApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: EventDrivenOrdersApi
      StageName: Prod
      DefinitionBody:
        swagger: '2.0'
        info:
          title: EventDrivenOrdersApi
          version: '1.0'
        schemes:
          - https
        consumes:
          - application/json
        produces:
          - application/json
        x-amazon-apigateway-request-validators:
          validate_body_and_params:
            validateRequestBody: true
            validateRequestParameters: true
        paths:
          /orders:
            post:
              parameters:
                - name: Idempotency-Key
                  in: header
                  required: true
                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
                - name: body
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/OrderRequest'
              x-amazon-apigateway-request-validator: validate_body_and_params
              responses:
                '202':
                  description: Order accepted for asynchronous processing
                '400':
                  description: Invalid order or idempotency key
                '500':
                  description: Order could not be accepted
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${EventDrivenAppOrderQueue.QueueName}
                credentials: !GetAtt ApiGatewaySqsRole.Arn
                passthroughBehavior: never
                requestParameters:
                  integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
                requestTemplates:
                  application/json: '#set($key = $input.params(''Idempotency-Key''))#set($request = "Action=InvalidIdempotencyKey")#if($key.matches("^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"))#set($encodedBody = $util.urlEncode($input.body))#set($encodedKey = $util.urlEncode($key))#set($request = "Action=SendMessage&MessageBody=$encodedBody&MessageAttribute.1.Name=IdempotencyKey&MessageAttribute.1.Value.DataType=String&MessageAttribute.1.Value.StringValue=$encodedKey")#end$request'
                responses:
                  '4\d{2}':
                    statusCode: '400'
                    responseTemplates:
                      application/json: '{"message":"Invalid or rejected order request"}'
                  '5\d{2}':
                    statusCode: '500'
                    responseTemplates:
                      application/json: '{"message":"Order could not be accepted"}'
                  default:
                    statusCode: '202'
                    responseTemplates:
                      application/json: '{"message":"Order accepted for processing"}'
        definitions:
          OrderRequest:
            type: object
            required:
              - orderId
              - itemId
            properties:
              orderId:
                type: string
                minLength: 1
              itemId:
                type: string
                minLength: 1
            additionalProperties: true

  EventDrivenOrdersDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: EventDrivenOrdersDashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "title": "Orders API requests and client errors",
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiName", "EventDrivenOrdersApi", "Stage", "Prod", { "stat": "SampleCount", "label": "Requests" } ],
                  [ ".", "4XXError", ".", ".", ".", ".", { "stat": "Sum", "label": "4XX errors" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Sum",
                "title": "Order Lambda invocations and errors",
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${CreateOrderFunction}", { "stat": "Sum", "label": "CreateOrderFunction invocations" } ],
                  [ ".", "Errors", ".", ".", { "stat": "Sum", "label": "CreateOrderFunction errors" } ],
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${ProcessOrderFunction}", { "stat": "Sum", "label": "ProcessOrderFunction invocations" } ],
                  [ ".", "Errors", ".", ".", { "stat": "Sum", "label": "ProcessOrderFunction errors" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "period": 300,
                "stat": "Maximum",
                "title": "Asynchronous order queue and DLQ depth",
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${EventDrivenAppOrderQueue.QueueName}", { "stat": "Maximum", "label": "Orders waiting" } ],
                  [ ".", ".", ".", "${EventDrivenAppOrderDLQ.QueueName}", { "stat": "Maximum", "label": "Orders in DLQ" } ]
                ]
              }
            }
          ]
        }

  EventDrivenAppOrderDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: EventDrivenAppOrderDLQMessagesVisible
      AlarmDescription: Alarm when one or more failed order messages are visible in the order DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EventDrivenAppOrderDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/save-order/
      Handler: index.handler
      Runtime: nodejs22.x
      Tracing: Active
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTableName
          ORDERS_EVENT_BUS: !Ref OrdersEventBus
          ORDERS_EVENT_ENDPOINT: !If [HasGlobalEndpointConfiguration, !Ref OrdersEventBusGlobalEndpoint, !Ref AWS::NoValue]
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${OrdersTableName}
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource:
                - !GetAtt OrdersEventBus.Arn
                - !If [HasGlobalEndpointConfiguration, !GetAtt OrdersEventBusGlobalEndpoint.Arn, !Ref AWS::NoValue]

Outputs:
  OrdersApiUrl:
    Description: Invoke URL for the orders REST API
    Value: !Sub https://${OrdersApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/
  OrdersEventBusName:
    Description: Name of the orders EventBridge event bus
    Value: !Ref OrdersEventBus
  OrdersEventBusGlobalEndpointName:
    Description: Global endpoint name for the orders EventBridge event bus when configured
    Value: !If [HasGlobalEndpointConfiguration, !Ref OrdersEventBusGlobalEndpoint, 'not-configured']
  OrdersEventBusGlobalEndpointArn:
    Description: ARN of the orders EventBridge global endpoint when configured
    Value: !If [HasGlobalEndpointConfiguration, !GetAtt OrdersEventBusGlobalEndpoint.Arn, 'not-configured']
  OrderProcessingQueueUrl:
    Description: URL of the order-processing SQS queue
    Value: !Ref OrderProcessingQueue
  OrderProcessingQueueArn:
    Description: ARN of the order-processing SQS queue
    Value: !GetAtt OrderProcessingQueue.Arn
  OrderProcessingDLQUrl:
    Description: URL of the order-processing dead-letter queue
    Value: !Ref OrderProcessingDLQ
  OrderProcessingDLQArn:
    Description: ARN of the order-processing dead-letter queue
    Value: !GetAtt OrderProcessingDLQ.Arn
  EventDrivenAppOrderQueueUrl:
    Description: URL of the API ingress order queue
    Value: !Ref EventDrivenAppOrderQueue
  EventDrivenAppOrderQueueArn:
    Description: ARN of the API ingress order queue
    Value: !GetAtt EventDrivenAppOrderQueue.Arn
  EventDrivenAppOrderDLQUrl:
    Description: URL of the API ingress order dead-letter queue
    Value: !Ref EventDrivenAppOrderDLQ
  EventDrivenAppOrderDLQArn:
    Description: ARN of the API ingress order dead-letter queue
    Value: !GetAtt EventDrivenAppOrderDLQ.Arn
  EventDrivenAppOrderDLQAlarmName:
    Description: CloudWatch alarm for visible messages in the API ingress order DLQ
    Value: !Ref EventDrivenAppOrderDLQAlarm
  EventDrivenAppIdempotencyTableName:
    Description: Name of the order idempotency table
    Value: !Ref EventDrivenAppIdempotencyTable
  OrderEventDeliveryDLQUrl:
    Description: URL of the EventBridge target delivery dead-letter queue
    Value: !Ref OrderEventDeliveryDLQ
  OrderEventDeliveryDLQArn:
    Description: ARN of the EventBridge target delivery dead-letter queue
    Value: !GetAtt OrderEventDeliveryDLQ.Arn
  CreateOrderFunctionName:
    Description: Name of the order-creation Lambda function
    Value: !Ref CreateOrderFunction
  ProcessOrderFunctionName:
    Description: Name of the order-processing Lambda function
    Value: !Ref ProcessOrderFunction
  OrderNotificationFunctionName:
    Description: Name of the order-notification Lambda function
    Value: !Ref OrderNotificationFunction
  OrderNotificationsTopicArn:
    Description: ARN of the order notifications SNS topic
    Value: !Ref OrderNotificationsTopic
  OrderNotificationsTopicName:
    Description: Name of the order notifications SNS topic
    Value: !GetAtt OrderNotificationsTopic.TopicName
  EventDrivenOrdersDashboardName:
    Description: Name of the CloudWatch dashboard for the orders application
    Value: !Ref EventDrivenOrdersDashboard
